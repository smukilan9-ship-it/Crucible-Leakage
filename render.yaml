services:
  - type: web
    name: crucible
    runtime: python
    # Starter rather than free: the free instance sleeps after fifteen minutes
    # and the first visitor after that waits about forty seconds on a blank
    # page. For a link being handed to people who will open it once, that first
    # impression is the whole demonstration.
    plan: starter
    buildCommand: pip install -e ".[web,vertex]"
    # One worker. Audit jobs live in this process's memory, so a second worker
    # would be answering progress polls for jobs it has never heard of.
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Vertex rather than the pooled AI Studio keys. The pool is capped per
      # day per key, and the day it empties every visitor is told that no
      # column order produced a usable answer, which reads as a broken tool
      # rather than an empty allowance. Vertex bills the project and has no
      # such cliff. Same models, same prompts, same verdicts.
      #
      # Needs, set in the dashboard: GOOGLE_CLOUD_PROJECT, and a secret file
      # holding a service-account key with the Vertex AI User role, with
      # GOOGLE_APPLICATION_CREDENTIALS pointing at where it is mounted.
      # Left unset so that deploying this does not switch the transport out
      # from under a running instance. Set it to `vertex` in the dashboard once
      # the project and the credentials file are in place, and the next deploy
      # picks it up; until then the pooled keys are used exactly as before.
      - key: CRUCIBLE_GEMINI_TRANSPORT
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false

      # Still read if the transport is switched back to the key pool.
      - key: CRUCIBLE_GEMINI_KEYS
        sync: false
      - key: CRUCIBLE_GEMINI_DAILY_LIMIT
        value: "20"

      # Optional. Setting one of these lets the server reach that provider
      # without a visitor supplying anything. Left unset, which is the normal
      # case for a public deployment, the matching model stays locked until
      # someone pastes their own key.
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # CRUCIBLE_RECALL_MODEL is deliberately not set here. It overrides the
      # catalogue default, and pointing it at a model that needs a key of its
      # own lands every visitor on a locked selection with nothing to run. The
      # catalogue's default is the best-measured model that needs no key, and a
      # test holds it to that.
      - key: CRUCIBLE_SHUFFLES
        value: "3"

      # How many rows the downstream comparison fits. This stage is ninety
      # fits, and on a shared CPU the 5,000 row default can take twenty minutes
      # on a wide table. Three thousand keeps the comparison honest and lets a
      # visitor watch it finish. The report always says how many rows were used.
      - key: CRUCIBLE_MAX_ROWS
        value: "3000"

      # Folds fitted at once. The forest could already spread one fit across
      # the cores; boosting cannot, and boosting is half of every run, so this
      # is where a paid instance's cores actually get spent. Left unset it
      # takes the core count, which is the right answer on a bigger plan too.
      - key: CRUCIBLE_FIT_JOBS
        sync: false

      # Where the visitor counter keeps its tally. Unset it and the count lives
      # in memory and resets on every deploy, which is fine until you care.
      - key: CRUCIBLE_STATS_FILE
        sync: false
