[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crucible-leakage"
version = "0.1.0"
description = "Find tabular columns that encode the outcome they are used to predict"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mukilan" }]
keywords = ["data-leakage", "target-leakage", "tabular", "data-quality",
            "machine-learning", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pandas>=2.0,<4.0",
  "scikit-learn>=1.4,<2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "python-multipart>=0.0.9,<1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ucimlrepo>=0.0.7", "certifi>=2024.0"]

[project.scripts]
crucible = "crucible.cli:main"

[project.urls]
Homepage = "https://github.com/smukilan9-ship-it/Crucible-Leakage"
Issues = "https://github.com/smukilan9-ship-it/Crucible-Leakage/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises the full downstream comparison; takes tens of seconds"]
